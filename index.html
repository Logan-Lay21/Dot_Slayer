<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot Slayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=0.9.10">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ver"></div>
  <div id="note"></div>
  <div id="touch" hidden><div id="stick"><i id="knob"></i></div></div>
  <div id="hud" hidden>
    <div id="bar"><i id="barfill"></i></div>
    <div class="tl">
      <div class="stat"><span class="lbl">Score</span><b id="score">000000</b></div>
      <div class="stat"><span class="lbl">Level</span><b id="level">1</b></div>
      <span class="lbl" id="left"></span>
      <div id="board"></div>
    </div>
    <button id="snd" class="snd" type="button" aria-label="Toggle sound">SOUND ON</button>
    <div class="tr"><canvas id="map" width="152" height="168"></canvas><div id="lives" aria-label="Lives left"></div></div>
    <div id="cross"></div>
    <div id="toast" role="status"></div>
    <div class="bm"><div id="pu"></div><div id="hpwrap" hidden><i id="hpfill"></i><b id="hptext">100</b></div><div id="spwrap"><i id="spfill"></i></div><div id="ammo">0</div><span class="lbl">Ammo</span><div id="guns"></div></div>
    <div id="hurt"></div>
  </div>
  <button id="fire" type="button" hidden>FIRE</button>
  <button id="jump" type="button" hidden>JUMP</button>
  <section id="panel" class="panel" role="dialog" aria-labelledby="ptitle">
    <h1 id="ptitle">Dot Slayer</h1>
    <p id="psub" class="sub"></p>
    <div id="pbody"></div>
    <button id="pbtn" class="btn" type="button">Play</button>
  </section>
</div>
