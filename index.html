<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot Slayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D view with the HUD pinned to the edges (score top-left, minimap top-right, ammo and guns bottom-center) and one centered card for title, pause and results. */
:root{
  --ink:#05060f; --panel:#080b24; --line:#2b3380; --wall:#4057ff;
  --dot:#ffd84a; --blood:#ff3b4e; --pink:#ff7ac8; --cyan:#46e6ff; --orange:#ff9a2e;
  --text:#eef1ff; --dim:#98a2e0;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:600 15px/1.35 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#touch{position:absolute;inset:0;z-index:1}
#hud{position:absolute;inset:0;z-index:2;pointer-events:none}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}

#bar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.08)}
#barfill{display:block;height:100%;width:0;background:var(--dot)}
.tl{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:6px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:400 26px/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.snd{position:absolute;top:14px;left:50%;transform:translateX(-50%);pointer-events:auto;font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--dim);background:rgba(8,11,36,.8);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.tr{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#map{width:min(114px,28vw);height:auto;border:1px solid var(--line);border-radius:6px;background:rgba(5,6,15,.72)}
#lives{display:flex;gap:6px}
.pip{width:14px;height:14px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px rgba(255,59,78,.6)}
.pip.off{background:transparent;border:2px solid #4a2330;box-shadow:none}
.bm{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#ammo{font:400 44px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--dot)}
#ammo.low{color:var(--blood);animation:blink .55s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#guns{display:flex;gap:6px;pointer-events:auto;margin-top:2px}
.gun{font-size:11px;line-height:1;font-weight:700;letter-spacing:.08em;color:var(--dim);background:rgba(8,11,36,.82);border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:56px;cursor:pointer}
.gun b{color:var(--text);margin-right:5px}
.gun.on{border-color:var(--dot);color:var(--dot)}
.gun.locked{opacity:.35;cursor:default}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.8);border-radius:50%;transition:transform .08s,border-color .08s}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--dot);border-radius:50%}
#cross.hit{border-color:var(--blood);transform:scale(1.5)}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font:400 clamp(18px,5vw,26px)/1.1 var(--display);text-align:center;opacity:0;white-space:nowrap;text-shadow:0 2px 0 #000}
#toast.show{animation:pop 1.9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.92)}12%{opacity:1;transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0}}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(255,40,60,.6));opacity:0;transition:opacity .6s}
#hurt.on{opacity:1;transition:none}

#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border:2px solid rgba(255,255,255,.3);border-radius:50%;opacity:0;pointer-events:none}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,216,74,.55)}
#fire{position:absolute;z-index:3;right:20px;bottom:20px;width:92px;height:92px;border-radius:50%;border:3px solid var(--blood);background:rgba(255,59,78,.25);color:var(--text);font:400 16px var(--display);letter-spacing:.06em;touch-action:none}
#fire:active{background:rgba(255,59,78,.6)}

.panel{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:rgba(7,9,28,.93);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.panel h1{font:400 clamp(32px,9vw,54px)/.95 var(--display);margin:0;color:var(--dot);text-wrap:balance}
.sub{margin:0;font-size:16px;font-weight:500;max-width:46ch}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rules li{position:relative;padding-left:20px;font-weight:500}
.rules li::before{content:"";position:absolute;left:2px;top:.45em;width:9px;height:9px;border-radius:50%;background:var(--dot)}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.roster li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03)}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.roster b{display:block;font-size:14px;letter-spacing:.06em}
.roster span{font-size:12px;color:var(--dim);font-weight:500}
.keys{margin:0;font-size:13px;color:var(--dim);font-weight:500}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.btn{align-self:flex-start;font:400 20px/1 var(--display);letter-spacing:.04em;color:#161200;background:var(--dot);border:0;border-radius:10px;padding:14px 26px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.gun:focus-visible,.snd:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line);font-size:15px;padding:11px 16px}
.btn.alt:hover{border-color:var(--dot);filter:none}
.mp{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.mprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mprow .btn{align-self:center}
.mprow input{width:104px;font:400 20px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--text);background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:10px;padding:11px 8px;-webkit-user-select:text;user-select:text}
.mprow input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.code{font:400 clamp(40px,12vw,64px)/1 var(--display);letter-spacing:.18em;color:var(--cyan)}
#board{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#board .pl{display:flex;align-items:center;gap:6px}
#board .sw{width:9px;height:9px}
#board .hpb{display:inline-block;width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#board .hpb i{display:block;height:100%;background:#5ef28a}
#pu{min-height:14px;font:400 12px/1 var(--display);letter-spacing:.08em;color:var(--cyan);text-shadow:0 1px 0 #000;white-space:pre}
#jump{position:absolute;z-index:3;right:34px;bottom:126px;width:68px;height:68px;border-radius:50%;border:3px solid var(--cyan);background:rgba(70,230,255,.18);color:var(--text);font:400 12px var(--display);letter-spacing:.05em;touch-action:none}
#jump:active{background:rgba(70,230,255,.5)}
#hpwrap{position:relative;width:min(240px,60vw);height:18px;border:2px solid var(--line);border-radius:9px;background:rgba(5,6,15,.75);overflow:hidden}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#5ef28a;transition:width .12s}
#hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 #000}
@media (prefers-reduced-motion:reduce){#ammo.low{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="touch" hidden><div id="stick"><i id="knob"></i></div></div>
  <div id="hud" hidden>
    <div id="bar"><i id="barfill"></i></div>
    <div class="tl">
      <div class="stat"><span class="lbl">Score</span><b id="score">000000</b></div>
      <div class="stat"><span class="lbl">Level</span><b id="level">1</b></div>
      <span class="lbl" id="left"></span>
      <div id="board"></div>
    </div>
    <button id="snd" class="snd" type="button" aria-label="Toggle sound">SOUND ON</button>
    <div class="tr"><canvas id="map" width="114" height="126"></canvas><div id="lives" aria-label="Lives left"></div></div>
    <div id="cross"></div>
    <div id="toast" role="status"></div>
    <div class="bm"><div id="pu"></div><div id="hpwrap" hidden><i id="hpfill"></i><b id="hptext">100</b></div><div id="ammo">0</div><span class="lbl">Ammo</span><div id="guns"></div></div>
    <div id="hurt"></div>
  </div>
  <button id="fire" type="button" hidden>FIRE</button>
  <button id="jump" type="button" hidden>JUMP</button>
  <section id="panel" class="panel" role="dialog" aria-labelledby="ptitle">
    <h1 id="ptitle">Dot Slayer</h1>
    <p id="psub" class="sub"></p>
    <div id="pbody"></div>
    <button id="pbtn" class="btn" type="button">Play</button>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const hasFinePointer = !!(window.matchMedia && matchMedia('(any-pointer: fine)').matches);
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window && !hasFinePointer);

/* Maze legend: # wall, . dot (ammo), o big dot (gun upgrade), G zombie start, P player start.
   The zombie pen is the 3-cell room on row 9 plus its door on row 8. */
const MAZE = [
  '###################',
  '#........#........#',
  '#o##.###.#.###.##o#',
  '#.................#',
  '#.##.#.#####.#.##.#',
  '#....#...#...#....#',
  '####.### # ###.####',
  '####.#   G   #.####',
  '####.# ## ## #.####',
  '####...#GGG#...####',
  '####.# ##### #.####',
  '####.#       #.####',
  '####.# ##### #.####',
  '#........#........#',
  '#.##.###.#.###.##.#',
  '#o.#.....P.....#.o#',
  '##.#.#.#####.#.#.##',
  '#....#...#...#....#',
  '#.######.#.######.#',
  '#.................#',
  '###################'
];
const ROWS = MAZE.length, COLS = MAZE[0].length, CS = 4, WALL_H = 3.4, EYE = 1.65;
const walls = [], dotAt = [], SPAWNS = [], dotList = [];
let playerStart = { c: 9, r: 15 };
for (let r = 0; r < ROWS; r++) {
  walls.push([]); dotAt.push([]);
  for (let c = 0; c < COLS; c++) {
    const ch = MAZE[r][c];
    walls[r][c] = ch === '#';
    dotAt[r][c] = null;
    if (ch === '.' || ch === 'o') {
      const d = { c, r, n: dotList.length, big: ch === 'o', alive: true, idx: -1, mesh: null };
      dotAt[r][c] = d; dotList.push(d);
    }
    if (ch === 'G') SPAWNS.push({ c, r });
    if (ch === 'P') playerStart = { c, r };
  }
}
const isPen = (c, r) => (r === 9 && c >= 8 && c <= 10) || (r === 8 && c === 9);
function wallAt(x, z) {
  const c = Math.floor(x / CS), r = Math.floor(z / CS);
  return c < 0 || r < 0 || c >= COLS || r >= ROWS || walls[r][c];
}
function solidAt(x, z) {
  const c = Math.floor(x / CS), r = Math.floor(z / CS);
  return c < 0 || r < 0 || c >= COLS || r >= ROWS || walls[r][c] || isPen(c, r);
}

/* ---------- renderer, scene, lights ---------- */
const canvas = $('view'), app = $('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.Fog(0x05060f, 8, 44);
const camera = new THREE.PerspectiveCamera(78, 1, 0.1, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0x7080d0, 0.75));
const lamp = new THREE.PointLight(0xdfe6ff, 1.0, 28, 1.4);
camera.add(lamp);
const flashLight = new THREE.PointLight(0xffa040, 0, 14, 1.5);
flashLight.position.set(0.3, -0.2, -1.2);
camera.add(flashLight);

function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  t.anisotropy = 4;
  return t;
}
const wallTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#070b33'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#4057ff'; g.lineWidth = 7; g.strokeRect(4, 4, w - 8, h - 8);
  g.strokeStyle = 'rgba(110,130,255,.35)'; g.lineWidth = 2; g.strokeRect(20, 20, w - 40, h - 40);
});
const floorTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#090b1c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#171d4d'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
}, COLS, ROWS);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CS, ROWS * CS), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(COLS * CS / 2, 0, ROWS * CS / 2); scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CS, ROWS * CS), new THREE.MeshBasicMaterial({ color: 0x04050d }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(COLS * CS / 2, WALL_H, ROWS * CS / 2); scene.add(ceil);

const wallCells = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (walls[r][c]) wallCells.push([c, r]);
const wallMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(CS, WALL_H, CS),
  new THREE.MeshStandardMaterial({ map: wallTex, emissiveMap: wallTex, emissive: 0xffffff, emissiveIntensity: 0.85, roughness: 0.7 }),
  wallCells.length
);
const m4 = new THREE.Matrix4();
wallCells.forEach(([c, r], i) => { m4.makeTranslation((c + 0.5) * CS, WALL_H / 2, (r + 0.5) * CS); wallMesh.setMatrixAt(i, m4); });
wallMesh.frustumCulled = false;
scene.add(wallMesh);

/* pen door bars */
const gateMat = new THREE.MeshBasicMaterial({ color: 0xff7ac8 });
[0.9, 1.7, 2.5].forEach(y => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(CS * 0.9, 0.12, 0.12), gateMat);
  b.position.set(9.5 * CS, y, 8.5 * CS); scene.add(b);
});

/* ---------- dots ---------- */
const smalls = dotList.filter(d => !d.big), bigs = dotList.filter(d => d.big);
const dotMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.26, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd84a }), smalls.length);
dotMesh.frustumCulled = false;
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
function placeDot(d) { m4.makeTranslation((d.c + 0.5) * CS, 1.0, (d.r + 0.5) * CS); dotMesh.setMatrixAt(d.idx, m4); }
smalls.forEach((d, i) => { d.idx = i; placeDot(d); });
dotMesh.instanceMatrix.needsUpdate = true;
scene.add(dotMesh);
bigs.forEach(d => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 14, 10), new THREE.MeshBasicMaterial({ color: 0xfff3b0 })));
  const cage = new THREE.Mesh(new THREE.OctahedronGeometry(0.95, 0), new THREE.MeshBasicMaterial({ color: 0xffd84a, wireframe: true }));
  g.add(cage); g.userData.cage = cage;
  g.position.set((d.c + 0.5) * CS, 1.3, (d.r + 0.5) * CS);
  scene.add(g); d.mesh = g;
});

/* ---------- weapons ---------- */
const WEAPONS = [
  { name: 'PISTOL', short: 'PISTOL', dmg: 1, cd: 0.4, cost: 1, pellets: 1, spread: 0, pierce: false, color: 0xdfe6ff, stun: 0.35, pvp: 14 },
  { name: 'SMG', short: 'SMG', dmg: 1, cd: 0.1, cost: 1, pellets: 1, spread: 0.018, pierce: false, color: 0xffd84a, stun: 0.2, pvp: 8 },
  { name: 'SHOTGUN', short: 'SHOTGUN', dmg: 1, cd: 0.72, cost: 2, pellets: 8, spread: 0.07, pierce: false, color: 0xff9a2e, stun: 0.5, pvp: 7 },
  { name: 'RAIL CANNON', short: 'RAIL', dmg: 6, cd: 0.6, cost: 3, pellets: 1, spread: 0, pierce: true, color: 0x46e6ff, stun: 0.9, pvp: 40 }
];

/* gun viewmodel lives in its own scene so it never clips into walls */
const gunScene = new THREE.Scene();
const gunCam = new THREE.PerspectiveCamera(60, 1, 0.05, 10);
gunScene.add(new THREE.AmbientLight(0xaab4ff, 0.9));
const gunSun = new THREE.DirectionalLight(0xffffff, 0.9);
gunSun.position.set(1, 2, 2); gunScene.add(gunSun);
const gunRoot = new THREE.Group();
gunRoot.position.set(0.34, -0.32, -0.62);
gunScene.add(gunRoot);
const gunMats = {
  body: new THREE.MeshStandardMaterial({ color: 0x252a52, roughness: 0.5, metalness: 0.4 }),
  accent: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xd9a37c, roughness: 0.8 }),
  sleeve: new THREE.MeshStandardMaterial({ color: 0x3a1f6b, roughness: 0.9 })
};
const muzzleFlash = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.02), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
muzzleFlash.visible = false;
function gbox(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); gunRoot.add(m); return m;
}
function buildGun(i) {
  while (gunRoot.children.length) gunRoot.remove(gunRoot.children[0]);
  const w = WEAPONS[i], B = gunMats.body, A = gunMats.accent;
  A.color.setHex(w.color); A.emissive.setHex(w.color);
  gbox(0.14, 0.14, 0.55, gunMats.sleeve, 0.02, -0.2, 0.34);
  gbox(0.1, 0.1, 0.14, gunMats.skin, 0, -0.1, 0.04);
  let mz = -0.3;
  if (i === 0) {
    gbox(0.08, 0.1, 0.36, B, 0, 0, -0.1); gbox(0.085, 0.02, 0.2, A, 0, 0.06, -0.15); gbox(0.07, 0.16, 0.09, B, 0, -0.12, 0.02);
  } else if (i === 1) {
    gbox(0.09, 0.13, 0.5, B, 0, 0, -0.12); gbox(0.04, 0.04, 0.25, B, 0, 0.02, -0.4); gbox(0.06, 0.22, 0.08, B, 0, -0.17, 0.0); gbox(0.095, 0.02, 0.3, A, 0, 0.075, -0.15); mz = -0.53;
  } else if (i === 2) {
    gbox(0.11, 0.1, 0.5, B, 0, 0, -0.05); gbox(0.05, 0.05, 0.7, B, -0.03, 0.05, -0.35); gbox(0.05, 0.05, 0.7, B, 0.03, 0.05, -0.35);
    gbox(0.13, 0.08, 0.2, A, 0, -0.06, -0.25); mz = -0.72;
  } else {
    gbox(0.12, 0.14, 0.7, B, 0, 0, -0.2);
    gbox(0.2, 0.2, 0.04, A, 0, 0, -0.1); gbox(0.2, 0.2, 0.04, A, 0, 0, -0.3); gbox(0.2, 0.2, 0.04, A, 0, 0, -0.5);
    gbox(0.05, 0.05, 0.3, B, 0, 0, -0.65); mz = -0.82;
  }
  muzzleFlash.position.set(0, 0.02, mz - 0.05);
  gunRoot.add(muzzleFlash);
}

/* ---------- particles and tracers ---------- */
const PART = [], pGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
for (let i = 0; i < 56; i++) {
  const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  m.visible = false; scene.add(m); PART.push({ m, vx: 0, vy: 0, vz: 0, life: 0 });
}
let partI = 0;

  muzzleFlash.visible = flashT > 0;
  muzzleFlash.scale.setScalar(0.8 + Math.random() * 0.8);
  flashLight.intensity = flashT > 0 ? 2.2 : 0;
  if (state === 'title') { yaw += dt * 0.25; }
}
function render() {
  camera.position.set(px, EYE + py + bobY, pz);
  camera.rotation.set(pitch, yaw, 0);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(gunScene, gunCam);
  if (state !== 'title') drawMap();
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (state === 'play') step(dt);
  if (state !== 'paused') fx(dt);
  render();
}

/* ---------- boot ---------- */
try { best = +localStorage.getItem('dotslayer-best') || 0; } catch (e) {}
window.addEventListener('touchstart', () => {}, { passive: true });
buildChips(); updateLives(); buildGun(0); refreshChips(); resetActors(); resize(); showTitle();
requestAnimationFrame(frame);

})();
</script>
